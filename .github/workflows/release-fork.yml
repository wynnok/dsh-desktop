name: Release the Apple Silicon DMG

# Fork-only release pipeline: an unsigned arm64 macOS DMG for local use. Upstream already publishes
# every other artifact this fork needs (including the Linux x64 Debian package), so the fork adds only
# the missing single-architecture build. The upstream source tree is never modified: every step reuses
# the artifacts the checked-in tree pins, and a clean-worktree gate fails the job if the build wrote
# a tracked file.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create or update the GitHub Release'
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: release-fork
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.g.outputs.publish }}
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(node -p "require('./dsh-desktop-next/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - id: g
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          publish=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          skip=false
          if [ "$publish" = true ] && gh release view "$TAG" >/dev/null 2>&1; then skip=true; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  mac:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Assert an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: corepack enable
      - id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v4
        with:
          path: |
            dsh-desktop-next/.desktop-build/downloads
            dsh-desktop-next/.desktop-build/runtime
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/node-gyp
          key: packaging-${{ runner.os }}-${{ runner.arch }}-next-arm64-${{ hashFiles('yarn.lock', 'deepseek-harness/scripts/primary-runtime/lock.json', 'dsh-desktop-next/package.json') }}
          restore-keys: |
            packaging-${{ runner.os }}-${{ runner.arch }}-next-arm64-
      - run: yarn install --immutable
      - name: Reuse the Agents Anywhere artifact pinned by provenance
        run: |
          commit=$(node -p "require('./vendor/agents-anywhere/provenance.json').commit")
          DSH_AA_SOURCE_REF="$commit" yarn aa:prepare-release
      - run: yarn workspace dsh-community-market build
      - run: yarn workspace dsh-desktop-next check:mac-package
      - name: Package the arm64 DMG
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_MAC_SMOKE_ARCH: arm64
        run: yarn workspace dsh-desktop-next dist:mac-smoke
      - name: Assert the source tree stayed identical
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain; echo '::error::the build modified tracked files'; exit 1; }
      - run: ls -lh dsh-desktop-next/dist/mac-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: dsh-desktop-next/dist/mac-smoke/*.dmg
          if-no-files-found: error

  release:
    needs: [prepare, mac]
    if: |
      needs.prepare.outputs.skip != 'true'
      && needs.mac.result == 'success'
      && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish with the upstream release notes verbatim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job: gh must not infer the repository from a git remote.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -lh dist
          body=$(gh api "repos/anywhere-labs/dsh-desktop/releases/tags/$TAG" --jq .body 2>/dev/null || true)
          if [ -n "$body" ]; then printf '%s\n' "$body" > notes.md; else printf 'DSH NEXT v%s\n' "$VERSION" > notes.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # The upstream release of a channel tag is a normal release, not a prerelease.
            gh release create "$TAG" dist/* --title "DSH NEXT v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
